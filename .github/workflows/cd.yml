name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Roll back: full commit SHA of an image already in ECR. Leave empty to build and deploy the current commit."
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

# One deploy at a time; a new run waits instead of cancelling one half done.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # Run after CI passes on a push to main, or when started by hand without a tag.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.push.outputs.image_tag }}
    env:
      # workflow_run starts on the default branch head, which may be newer than
      # the commit CI tested, so build exactly the commit CI tested.
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Build images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          docker build -t "$REGISTRY/kinetilearn-backend:$IMAGE_TAG" backend
          docker build \
            --build-arg VITE_API_BASE_URL="$PUBLIC_URL" \
            -t "$REGISTRY/kinetilearn-frontend:$IMAGE_TAG" \
            frontend

      - name: Push images
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push "$REGISTRY/kinetilearn-backend:$IMAGE_TAG"
          docker push "$REGISTRY/kinetilearn-frontend:$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Pushed image tag \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    # After a successful build, or with build skipped for a rollback tag.
    if: >-
      !cancelled() &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.image_tag }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Check image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full 40-character commit SHA, got '$IMAGE_TAG'"
            exit 1
          fi

      # Same commit as the image, so a rollback also gets the matching compose file.
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The command carries deploy.sh and the compose file as base64, never secrets:
      # Run Command history and CloudTrail keep the full text.
      - name: Send deploy command
        id: send
        run: |
          compose_b64=$(base64 -w0 docker-compose.prod.yml)
          script_b64=$(base64 -w0 deploy/deploy.sh)
          commands="set -e
          install -d -m 700 -o root -g root /opt/kinetilearn /opt/kinetilearn/incoming
          echo '$compose_b64' | base64 -d > /opt/kinetilearn/incoming/docker-compose.prod.yml
          echo '$script_b64' | base64 -d > /opt/kinetilearn/incoming/deploy.sh
          bash /opt/kinetilearn/incoming/deploy.sh $IMAGE_TAG"
          jq -n --arg c "$commands" '{commands: [$c], executionTimeout: ["900"]}' > params.json
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "Sent command $command_id"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          status=Pending
          for _ in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2> /dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done
          echo "Status: $status"
          echo "----- deploy.sh output -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- deploy.sh errors -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "Deploy of \`$IMAGE_TAG\`: $status" >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" == "Success" ]]
