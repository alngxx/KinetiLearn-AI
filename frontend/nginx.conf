server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 20 MiB by the API; leave room for multipart overhead.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat answers are streamed as SSE: pass each chunk on at once and keep
        # the connection open while the model is still answering.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # React Router handles paths like /admin/classes, so unknown paths get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
